<style>
body{
margin:5;
padding:60px;
font-family:Arial, sans-serif;
background:#f5f5f5;
}
.search-box{
width:450px;
margin:auto;
}
.search-box input{
width:200px	
padding:12px;
border:2px solid #1877f2;
border-radius:150px;
font-size:18px;
outline:none;
box-sizing:border-box;
}
search-box input:focus;
border-color:#0d65d9;
box-shadow:0 0 8px rgba(24,119,242,.4);
}

 
body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f2f5;
}
.conversations{
width:350px;
margin:20px auto;
background:#fff;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
overflow:hidden;
}
.titre{
background:#1877f2;
color:#fff;
padding:15px;
font-size:22px;
text-align:center;
}
.conversation{
display:flex;
align-items:center;
padding:15px;
border-bottom:1px solid#ddd;
cursor:pointer;
}
.conversation:hover{
background:#f5f5f5;
}
.photo{
width:50px;
height:50px;
border-radius:50%;
background:#ccc;
margin-right:15px;
}
.nom{
font-weight:bold;
font-size:16px;
}
.message{
color:red;
font-size:14px;
}
</style>

<div class="search-box">
