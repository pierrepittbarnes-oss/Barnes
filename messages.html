<style>
.chat-box{
position:fixed;
bottom:20px;
right:20px;
width:300px;
height:400;
background:#ffffff;
border:1px solid #ccc;
border-radius:8px;
display:flex;
flex-direction:column;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
font-family:sans-serif;
}
.chat-header{
background:#007bff;
color:white;
padding:10px;
border-top-left-radius:8px;
border-top-right-radius:8px;
font-weight:bold;
}
.chat-body{
flex:1;
padding:10px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px;
background:#f8f9fa;
}
.message{
max-width:80%;
padding:8px 12px;
border-radius:12px;
font-size:14px;
}
.message.incoming{
background:#e007bff;
color:white;
align-self:flex-end;
}
.chat-footer{
display:flex;
padding:8px;
border-top:1px solid #ccc;
background:#fff;
}
.chat-footer input{
flex:1;
padding:6px;
border:1px solid #ccc;
border-radius:4px;
outline:none;
}
.chat-footer button{
margin-left:6px;
padding:6px 12px;
background:#007bff;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}
